# Gera os cards de estatisticas do perfil (tema Dracula) dentro do proprio repositorio.
name: Profile Summary Cards

on:
  schedule:
    # Atualiza a cada 12 horas.
    - cron: "0 */12 * * *"
  # Permite executar manualmente pela aba Actions.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
